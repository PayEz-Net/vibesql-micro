name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build Linux binary
        run: GOOS=linux GOARCH=amd64 go build -o vsql-micro-linux ./cmd/vsql-micro
      - name: Run unit tests
        run: go test ./pkg/vsql/ -v
      - name: Run integration tests
        run: go run test_integration.go && go run test_comprehensive.go
      - name: Run CLI tests
        run: bash test_linux_cli.sh
